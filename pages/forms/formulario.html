<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
     margin: 0;
     min-height: 100vh;
     flex-direction: column;
     background: #F5F1EA;
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 }

 .steps-vertical, .controls, h1{
    padding-left: 2rem;
    padding-right: 2rem;
 }
 /* Vertical Steps Style */
 .steps-vertical {
     max-width: 700px;
     margin: 2rem auto;
     padding: 0;
 }

 .step-vertical {
     display: flex;
     position: relative;
     padding: 1rem 0;
 }

 .step-vertical:not(:last-child)::after {
     content: '';
     position: absolute;
     left: 25px;
     top: 60px;
     bottom: 0;
     width: 2px;
     background: #e9ecef;
 }

 .step-vertical-icon {
     width: 50px;
     height: 50px;
     border-radius: 50%;
     background: white;
     border: 2px solid #dee2e6;
     display: flex;
     align-items: center;
     justify-content: center;
     margin-right: 1rem;
     font-size: 20px;
     color: #6c757d;
     position: relative;
     z-index: 2;
     flex-shrink: 0;
 }

 .step-vertical-content {
     padding-top: 0.5rem;
 }

 .step-vertical.active .step-vertical-icon {
     background: #4361ee;
     border-color: #4361ee;
     color: white;
     box-shadow: 0 0 0 5px rgba(67, 97, 238, 0.2);
 }

 .step-vertical.complete .step-vertical-icon {
     background: #2ecc71;
     border-color: #2ecc71;
     color: white;
 }

 /* Interactive buttons */
 .controls {
     text-align: center;
 }

 .btn {
     padding: 8px 16px;
     border-radius: 6px;
     border: none;
     background: #4361ee;
     color: white;
     cursor: pointer;
     margin: 0 5px;
     transition: all 0.3s ease;
 }

 .btn:hover {
     background: #3451c6;
 }

 .btn:disabled {
     background: #dee2e6;
     cursor: not-allowed;
 }

 .step-vertical-content form {
    display: none;
}

.step-vertical.active form {
    display: block;
}
    </style>
</head>
<body>
    <div id="header"></div>
    <script src="/pages/main/header.js"></script>
    <h1 class="text-center mb-4">Encomenda de Carnes</h1>
    <div class="steps-vertical">
    <div class="step-vertical active">
        <div class="step-vertical-icon">
            <i class="fas fa-check"></i>
        </div>
        <div class="step-vertical-content">
            <h4>Dados do Cliente</h4>
            <form>
              <fieldset class="border rounded-3 p-4 bg-white shadow-sm">
            <div class="mb-3">
               <label for="nome" class="form-label">Nome completo</label>
               <input type="text" class="form-control" id="nome" name="nome">
            </div>

            <div class="row">
            <div class="col-md-6 mb-3">
               <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="telefone" name="telefone">
            </div>

            <div class="col-md-6 mb-3">
               <label for="email" class="form-label">E-mail</label>
               <input type="email" class="form-control" id="email" name="email">
            </div>
        </div>
               </fieldset>
            </form>
        </div>
    </div>
    <div class="step-vertical">
        <div class="step-vertical-icon">
            <i class="fas fa-envelope"></i>
        </div>
        <div class="step-vertical-content">
            <h4>Detalhes da Encomenda</h4>
            <form>
              <fieldset class="border rounded-3 p-4 bg-white shadow-sm">
            <div class="mb-3">
               <label for="quantidade" class="form-label">Quantidade em kg</label>
               <input type="number" class="form-control" id="quantidade" name="quantidade">
            </div>
             
            <div class="row">
            <div class="col-md-6 mb-3">
               <label for="carne" class="form-label">Tipo de Carne</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="bovina" name="carne">
               <label for="bovina" class="form-check-label">Bovina</label>
               </div>
               <div class="form-check">
                <input type="radio" class="form-check-input" id="suina" name="carne">
               <label for="suina" class="form-check-label">Suína</label>
               </div>
               <div class="form-check">
                <input type="radio" class="form-check-input" id="frango" name="carne">
               <label for="frango" class="form-check-label">Frango</label>
               </div>
            </div>

            <div class="col-md-6 mb-3">
               <label for="corte" class="form-label">Corte preferido</label>
               <select name="corte" id="corte" class="form-select">
                  <option selected disabled>Escolha o corte</option>
                  <option>Picanha</option>
                  <option>Coxão Duro</option>
                  <option>Costela</option>
                  <option>Coxão Mole</option>
                  <option>Picanha</option>
                  <option>Mingão</option>
               </select>
            </div>
            </div>

            <div class="mb-3">
               <label for="prepar" class="form-label">Forma de preparo desejada</label>
               <select class="form-select" id="preparo" name="preparo">
                 <option selected disabled>Forma de Preparo</option>
                 <option>Bife</option>
                 <option>Moída</option>
                 <option>Em cubos</option>
                 <option>Em tiras</option>
                 <option>Para churrasco</option>
                 <option>Para panela</option>
               </select>
            </div>

            <div class="row">
            <div class="col-md-6 mb-3">
               <label for="tempero" class="form-label">Quer tempero?</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="sim" name="tempero">
               <label for="sim" class="form-check-label">Sim</label>
               </div>
               <div class="form-check">
                <input type="radio" class="form-check-input" id="nao" name="tempero">
               <label for="nao" class="form-check-label">Não</label>
               </div>
            </div>

            <div class="col-md-6 mb-3">
               <label for="tipostemp" class="form-label">Tipos de Temperos</label>
               <div class="form-check">
                  <input class="form-check-input" id="tipostemp" type="checkbox">
                  <label for="alho" class="form-check-label">Alho</label>
               </div>
                  <div class="form-check">
                  <input class="form-check-input" id="tipostemp" type="checkbox">
                  <label for="chimichurri" class="form-check-label">Chimichurri</label>
               </div>
               <div class="form-check">
                  <input class="form-check-input" id="tipostemp" type="checkbox">
                  <label for="paprica" class="form-check-label">Páprica</label>
               </div>
               <div class="form-check">
                  <input class="form-check-input" id="tipostemp" type="checkbox">
                  <label for="lemonpepper" class="form-check-label">Lemon Pepper</label>
               </div>
            </div>
            </div>
               </fieldset>
            </form>
        </div>
    </div>
    <div class="step-vertical">
        <div class="step-vertical-icon">
            <i class="fas fa-cog"></i>
        </div>
        <div class="step-vertical-content">
            <h4>Finalização</h4>
            <form>
              <fieldset class="border rounded-3 p-4 bg-white shadow-sm">
            <div class="mb-3">
                <label class="form-label">Forma de recebimento</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="recebimento" id="retirada" onclick="mostrarEntrega()">
                    <label for="retirada" class="form-check-label">Retirada no local</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="recebimento" id="delivery" onclick="mostrarEntrega()">
                    <label for="delivery" class="form-check-label">Delivery</label>
                </div>
                <!--Dados escondidos da RETIRADA NO LOCAL-->
                <div id="dadosRetirada" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label">Data de retirada</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Horário</label>
                        <input type="time" class="form-control">
                    </div>
                </div>
                <!--Dados escondidos do DELIVERY-->
                <div id="dadosDelivery" style="display: none;">
                    <input type="text" class="form-control mb-3" placeholder="Endereço">
                    <input type="text" class="form-control mb-3" placeholder="Cidade">
                    <input type="text" class="form-control mb-3" placeholder="CEP">
                </div>
            </div>

            <div class="row">
            <div class="col-md-6 mb-3">
               <label class="form-label">Forma de Pagamento</label>
               <div class="form-check">
                <input type="radio" name="pagamento" id="pix" class="form-check-input" onclick="mostrarPagamento()">
                <label for="pix" class="form-check-label">PIX</label>
               </div>
               <div class="form-check">
                <input type="radio" name="pagamento" id="dinheiro" class="form-check-input" onclick="mostrarPagamento()">
                <label for="pix" class="form-check-label">Dinheiro</label>
               </div>
               <div class="form-check">
                <input type="radio" name="pagamento" id="cartao" class="form-check-input" onclick="mostrarPagamento()">
                <label for="pix" class="form-check-label">Cartão</label>
               </div>

               <!--Dados escondidos do PIX-->
               <div id="dadosPix" style="display: none;">
                  <div class="alert alert-success mt-3">Chave Pix: corteimperial@gmail.com</div>
               </div>
               <!--Dados escondidos do DINHEIRO-->
               <div id="dadosDinheiro" style="display: none;">
                  <label class="form-label mt-3">Troco para quanto?</label>
                  <input type="number" class="form-control">
               </div>
               <!--Dados escondidos do CARTÃO-->
               <div id="dadosCartao" style="display: none;">
                  <div class="mb-3 mt-3">
                    <label class="form-label">Numero do cartão</label>
                    <input type="text" class="form-control">
                  </div>
                  <div class="mb-3">
                     <label class="form-label">Nome impresso no cartão</label>
                     <input type="text" class="form-control">
                  </div>
                  <div class="row">
                       <div class="col-md-6">
                          <label class="form-label">Validade</label>
                          <input type="month" class="form-control">
                       </div>
                       <div class="col-md-6">
                          <label class="form-label">CVV</label>
                          <input type="password" class="form-control">
                       </div>
                  </div>
               </div>
            </div>
               </fieldset>
            </form>
        </div>
    </div>
</div>

<div class="controls">
    <button class="btn" onclick="previousStep()">Voltar</button>
    <button class="btn" onclick="nextStep()" id="btnNext">Próximo</button>
</div>
<div id="mensagemSucesso"
     class="alert alert-success mt-4 text-center"
     style="display: none;">

    Pedido realizado com sucesso!

</div>
<script>
    let currentStep = 1;
const maxSteps = 3;

function updateSteps(stepElements, step) {
    stepElements.forEach((element, index) => {
        if (index < step - 1) {
            element.className = element.className.replace(/ active| complete|\b$/, ' complete');
        } else if (index === step - 1) {
            element.className = element.className.replace(/ active| complete|\b$/, ' active');
        } else {
            element.className = element.className.replace(/ active| complete|\b$/, '');
        }
    });
    let btnNext =
    document.getElementById("btnNext");

if (step === maxSteps) {
    btnNext.innerText =
        "Finalizar Pedido";

} else {
    btnNext.innerText =
        "Próximo";
}
}

function nextStep() {

    if (currentStep < maxSteps) {
        currentStep++;
        updateSteps(
            document.querySelectorAll('.step-vertical'),
            currentStep
        );
    } else {
        mostrarSucesso();
    }
}

function mostrarSucesso() {

    document.getElementById("mensagemSucesso")
    .style.display = "block";

}

function previousStep() {
    if (currentStep > 1) {
        currentStep--;
        updateSteps(document.querySelectorAll('.step-vertical'), currentStep);
    }
}

function mostrarEntrega() {

    let retirada = document.getElementById("retirada");
    let delivery = document.getElementById("delivery");

    let dadosRetirada =
        document.getElementById("dadosRetirada");

    let dadosDelivery =
        document.getElementById("dadosDelivery");

    if (retirada.checked) {

        dadosRetirada.style.display = "block";
        dadosDelivery.style.display = "none";

    }

    if (delivery.checked) {

        dadosDelivery.style.display = "block";
        dadosRetirada.style.display = "none";

    }
}

function mostrarPagamento() {

    let pix =
        document.getElementById("pix");

    let dinheiro =
        document.getElementById("dinheiro");

    let cartao =
        document.getElementById("cartao");

    let dadosPix =
        document.getElementById("dadosPix");

    let dadosDinheiro =
        document.getElementById("dadosDinheiro");

    let dadosCartao =
        document.getElementById("dadosCartao");

    dadosPix.style.display = "none";
    dadosDinheiro.style.display = "none";
    dadosCartao.style.display = "none";

    if (pix.checked) {
        dadosPix.style.display = "block";
    }

    if (dinheiro.checked) {
        dadosDinheiro.style.display = "block";
    }

    if (cartao.checked) {
        dadosCartao.style.display = "block";
    }
}
</script>
<div id="footer"></div>
    <script src="/pages/main/footer.js"></script>
</body>
</html>
